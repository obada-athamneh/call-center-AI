<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحياة للطاقة المتجددة | المساعد الصوتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /*
   * Al Hayat website + voice assistant.
   * The app itself is ui/app.js (built from web/ with esbuild, see web/README.md).
   * Concept: the page is a morning over a field of solar panels. The sun rises when a
   * call starts and pulses with the assistant's voice; whatever the assistant talks
   * about is brought into view and marked in solar gold.
   */
  :root {
    --bg: #f3f6f9;           /* morning haze */
    --surface: #ffffff;
    --ink: #14233b;          /* night navy, text */
    --ink-soft: #4a5a72;
    --line: #d9e2ec;
    --panel: #1f4e79;        /* solar-panel blue */
    --panel-soft: #e3edf6;
    --sky: #8ec5e8;
    --sun: #f2a922;          /* solar gold */
    --sun-soft: #fdf1d8;
    --sun-ink: #3a2500;
    --danger: #c2412d;

    --bot: 0; --user: 0;     /* voice levels, set by ui/app.js */

    --display: "El Messiri", "Readex Pro", system-ui, sans-serif;
    --body: "Readex Pro", system-ui, "Segoe UI", Tahoma, sans-serif;
    --header-h: 68px;
    --radius-lg: 18px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: calc(var(--header-h) + 16px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1rem;
    line-height: 1.65;
    padding-bottom: 120px; /* room for the call bar */
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.25; margin: 0; }
  p { margin: 0; }
  ul, ol, dl { margin: 0; padding: 0; list-style: none; }
  a { color: inherit; }
  button, input, select { font: inherit; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }

  /* ---------- header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 20;
    height: var(--header-h);
    display: flex; align-items: center; gap: 20px;
    padding: 0 clamp(16px, 4vw, 48px);
    background: rgba(243, 246, 249, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
  .brand strong { display: block; font-family: var(--display); font-size: 1.1rem; line-height: 1.2; }
  .brand small { display: block; font-size: .72rem; color: var(--ink-soft); direction: ltr; text-align: right; }
  .site-header nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline-start: auto; }
  .site-header nav a {
    white-space: nowrap; text-decoration: none; font-size: .92rem; color: var(--ink-soft);
    padding: 6px 10px; border-radius: 999px;
  }
  .site-header nav a:hover { color: var(--ink); background: var(--panel-soft); }
  .header-call { flex: none; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; cursor: pointer; text-decoration: none; white-space: nowrap;
    padding: 11px 22px; border-radius: 999px; font-weight: 600;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn-sun { background: var(--sun); color: var(--sun-ink); box-shadow: 0 6px 18px rgba(242, 169, 34, .35); }
  .btn-sun:hover { box-shadow: 0 8px 24px rgba(242, 169, 34, .5); }
  .btn-ghost { background: transparent; color: var(--panel); box-shadow: inset 0 0 0 1.5px var(--panel); }
  .btn-end { background: var(--ink); color: #fff; }

  /* ---------- hero: sunrise over a panel field ---------- */
  .hero {
    position: relative; overflow: hidden;
    min-height: min(78vh, 640px);
    display: grid; align-items: end;
    padding: 0 clamp(16px, 4vw, 48px) clamp(32px, 6vh, 64px);
    scroll-margin-top: 0;
  }
  .hero-sky {
    position: absolute; inset: 0 0 34% 0;
    background: linear-gradient(to bottom, #dcebf6 0%, #eaf2f8 55%, #fbe7c8 100%);
  }
  .hero-sun {
    position: absolute; left: 24%; bottom: 0;
    width: clamp(160px, 26vw, 300px); aspect-ratio: 1;
    transform: translate(-50%, 62%);
    transition: transform 2.2s cubic-bezier(.2, .7, .1, 1);
  }
  .hero.is-live .hero-sun { transform: translate(-50%, 38%); }
  .hero-sun::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #fff6dc 0%, var(--sun) 60%, #e3881c 100%);
    box-shadow: 0 0 calc(30px + var(--bot) * 80px) rgba(242, 169, 34, .65);
  }
  .hero-corona {
    position: absolute; inset: -45%; border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 169, 34, .38) 0%, rgba(242, 169, 34, .1) 40%, transparent 66%);
    transform: scale(calc(.85 + var(--bot) * .5));
    transition: transform .12s linear;
  }
  .hero-ground {
    position: absolute; inset: 66% 0 0 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.12) 0 1px, transparent 1px 34px),
      linear-gradient(to bottom, var(--panel), #16385a);
    border-top: 2px solid #f6c873;
  }
  .hero-copy {
    position: relative; z-index: 1;
    max-width: 640px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: clamp(20px, 3vw, 32px);
    box-shadow: 0 20px 50px rgba(20, 35, 59, .18);
  }
  .hero-copy h1 { font-size: clamp(1.7rem, 3.6vw, 2.6rem); font-weight: 700; margin-bottom: 10px; }
  .hero-copy p { color: var(--ink-soft); max-width: 52ch; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
  .live-pill { background: var(--sun-soft); color: var(--sun-ink); padding: 10px 18px; border-radius: 999px; font-weight: 600; }

  /* ---------- sections ---------- */
  main > .section {
    max-width: 1080px; margin: 0 auto;
    padding: clamp(48px, 8vh, 80px) clamp(16px, 4vw, 48px) 0;
    position: relative;
  }
  .section-head { margin-bottom: 24px; max-width: 64ch; }
  .section-head h2 { font-size: clamp(1.5rem, 2.6vw, 2rem); }
  .lead { color: var(--ink-soft); margin-top: 6px; }
  .note { color: var(--ink-soft); font-size: .9rem; margin-top: 14px; }

  /* focus: a gold rule grows beside the section title when the assistant brings it up */
  .section-head h2::before {
    content: ""; display: inline-block; vertical-align: middle;
    width: 0; height: .9em; margin-inline-end: 0;
    background: var(--sun); border-radius: 3px;
    transition: width .35s ease, margin .35s ease;
  }
  .section.is-focused .section-head h2::before { width: 8px; margin-inline-end: 12px; }

  /* item highlight / spotlight */
  .target { transition: box-shadow .3s ease, opacity .3s ease, transform .3s ease; scroll-margin: 120px; }
  .target.is-highlighted { box-shadow: 0 0 0 3px var(--sun), 0 10px 30px rgba(242, 169, 34, .35); animation: glow 1.4s ease-in-out 2; }
  .section.has-spotlight .target:not(.is-spotlit) { opacity: .38; }
  .target.is-spotlit { box-shadow: 0 0 0 3px var(--sun), 0 16px 40px rgba(20, 35, 59, .18); transform: translateY(-3px); }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(242, 169, 34, .55), 0 10px 30px rgba(242, 169, 34, .45); } }

  .grid { display: grid; gap: 14px; }
  .grid.services { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .grid.three { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 18px;
  }
  .card h3 { font-size: 1.08rem; margin: 10px 0 4px; }
  .card p { color: var(--ink-soft); font-size: .95rem; }
  .card.flat h3 { margin-top: 0; }
  .card-icon {
    display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
    background: var(--panel-soft); color: var(--panel);
  }

  /* about */
  .mission { font-family: var(--display); font-size: 1.25rem; color: var(--panel); margin-bottom: 18px; }
  .stats { display: flex; flex-wrap: wrap; gap: 28px; }
  .stats div { display: flex; flex-direction: column-reverse; }
  .stats dd { margin: 0; font-family: var(--display); font-size: 1.9rem; font-weight: 700; color: var(--panel); line-height: 1.1; }
  .stats dt { color: var(--ink-soft); font-size: .9rem; }

  /* prices: reads like a meter readout */
  .price-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
  .price-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--line); border-radius: 0;
  }
  .price-row:last-child { border-bottom: 0; }
  .price { white-space: nowrap; color: var(--ink-soft); font-size: .9rem; }
  .price b { font-family: var(--display); font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .price-row.is-highlighted { background: var(--sun-soft); }

  /* warranty */
  .warranty-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .warranty {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px;
  }
  .warranty .years { flex: none; min-width: 74px; text-align: center; color: var(--panel); font-size: .85rem; }
  .warranty .years b { display: block; font-family: var(--display); font-size: 1.6rem; line-height: 1; }
  .warranty strong { display: block; }
  .warranty small { color: var(--ink-soft); }

  /* process: a real sequence, so it's numbered */
  .steps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); counter-reset: step; }
  .step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; }
  .step-num {
    display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--panel); color: #fff; font-weight: 600; margin-bottom: 10px;
  }
  .step h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .step p { color: var(--ink-soft); font-size: .95rem; }

  /* offers */
  .offer {
    background: var(--sun-soft); border-radius: var(--radius-lg); padding: 18px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .offer strong { font-family: var(--display); font-size: 1.4rem; color: var(--sun-ink); }

  /* branches */
  .branch .hours { margin-top: 8px; font-size: .88rem; color: var(--panel); }

  /* faq */
  .faq { display: grid; gap: 8px; }
  .faq-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .faq-item button {
    width: 100%; display: flex; justify-content: space-between; gap: 12px; align-items: center;
    background: none; border: 0; padding: 14px 16px; cursor: pointer; text-align: start; color: var(--ink); font-weight: 500;
  }
  .faq-sign { font-size: 1.3rem; color: var(--panel); line-height: 1; }
  .faq-item > div { padding: 0 16px 14px; color: var(--ink-soft); }

  /* contact + visit form */
  .contact-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: start; }
  .contact-list { display: grid; gap: 8px; }
  .contact-list li {
    display: flex; justify-content: space-between; gap: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px;
  }
  .contact-list span { color: var(--ink-soft); }
  .visit-form {
    display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 20px;
  }
  .visit-form h3 { font-size: 1.15rem; }
  .visit-form label { display: grid; gap: 4px; font-size: .9rem; color: var(--ink-soft); }
  .visit-form input, .visit-form select {
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--ink); background: #fff;
  }
  .bot-filled { background: var(--sun-soft); color: var(--sun-ink); padding: 8px 12px; border-radius: var(--radius-sm); font-size: .9rem; }
  .sent { color: var(--panel); font-weight: 500; }

  .site-footer { max-width: 1080px; margin: 64px auto 0; padding: 0 clamp(16px, 4vw, 48px); color: var(--ink-soft); font-size: .85rem; }

  /* ---------- call bar ---------- */
  .callbar {
    position: fixed; z-index: 30; bottom: 16px; left: 50%; transform: translateX(-50%);
    width: min(720px, calc(100% - 32px));
    background: var(--ink); color: #fff;
    border-radius: 22px; box-shadow: 0 18px 50px rgba(20, 35, 59, .35);
    overflow: hidden;
  }
  .callbar-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; }
  .mini-sun { flex: none; width: 40px; height: 40px; display: grid; place-items: center; }
  .mini-sun span {
    width: 22px; height: 22px; border-radius: 50%; background: var(--sun);
    box-shadow: 0 0 0 calc(var(--bot) * 10px) rgba(242, 169, 34, .3), 0 0 calc(6px + var(--bot) * 18px) rgba(242, 169, 34, .7);
    opacity: .55; transition: opacity .3s ease;
  }
  .callbar.is-active .mini-sun span { opacity: 1; }
  .callbar-text { flex: 1; min-width: 0; display: grid; }
  .callbar .status { font-size: .78rem; color: var(--sky); }
  .callbar .caption { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; text-align: start; }
  .icon-btn {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; background: rgba(255,255,255,.1); color: #fff;
  }
  .icon-btn.muted { background: var(--danger); }
  .callbar .btn-end { background: #fff; color: var(--ink); }
  .callbar-log {
    max-height: 40vh; overflow-y: auto; padding: 14px 16px 4px; display: grid; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  .callbar-log .line { font-size: .95rem; unicode-bidi: plaintext; text-align: start; }
  .callbar-log .line .who { display: block; font-size: .72rem; color: var(--sky); }
  .callbar-log .line.bot .who { color: var(--sun); }
  .callbar-log .line.interim { opacity: .6; }
  .callbar-log .muted { color: rgba(255,255,255,.6); }
  .callbar-notice { background: #fbe1dc; color: #6b1f12; padding: 10px 16px; font-size: .9rem; }

  @media (max-width: 760px) {
    :root { --header-h: 60px; }
    .brand small, .header-call { display: none; }
    .brand strong { font-size: 1rem; }
    .contact-grid { grid-template-columns: 1fr; }
    .hero { min-height: 82vh; }
    .hero-sky { inset: 0 0 52% 0; }
    .hero-ground { inset: 48% 0 0 0; }
    .hero-sun { left: 50%; }
    .callbar { bottom: 8px; width: calc(100% - 16px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<noscript>الموقع بحاجة لتشغيل JavaScript.</noscript>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
