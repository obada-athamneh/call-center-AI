<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحياة للطاقة المتجددة | المساعد الصوتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /*
   * Al Hayat voice assistant - custom interface.
   * The original Pipecat Playground is untouched at /client/.
   * Concept: connecting = sunrise. The sun's corona follows the bot's voice,
   * the light on the horizon follows the user's voice.
   */
  :root {
    --night: #15203a;      /* desert night sky */
    --dusk: #2f4a73;       /* upper dawn sky */
    --dawn: #e9b48a;       /* sunrise glow near the horizon */
    --sun: #f6b73c;        /* solar gold */
    --sun-core: #fff1c9;
    --sand: #efe6d2;       /* text on dark */
    --panel: #1d3557;      /* solar-panel blue (ground) */
    --panel-line: rgba(142, 197, 232, .14);
    --sky-light: #8ec5e8;
    --danger: #ff9b85;

    --rise: 0;             /* 0 = night, 1 = sunrise (set by JS) */
    --bot: 0;              /* bot voice level 0..1 */
    --user: 0;             /* user voice level 0..1 */

    --hdr: 84px;           /* header height */
    --sky-h: 46dvh;        /* height of the sky area above the horizon */

    --display: "El Messiri", "Readex Pro", system-ui, sans-serif;
    --body: "Readex Pro", system-ui, "Segoe UI", Tahoma, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--sand);
    font-family: var(--body);
    font-size: 1rem;
    line-height: 1.6;
    overflow: hidden;
  }

  .scene {
    position: relative;
    height: 100dvh;
    display: grid;
    grid-template-rows: var(--hdr) minmax(220px, var(--sky-h)) 1fr;
  }

  /* ---------- Sky ---------- */
  .sky {
    position: absolute;
    inset: 0 0 auto 0;
    height: calc(var(--hdr) + max(220px, var(--sky-h)));
    background:
      linear-gradient(to bottom, var(--night) 0%, var(--dusk) 62%, #c98f74 92%, var(--dawn) 100%);
    opacity: calc(.25 + var(--rise) * .75);
    transition: opacity 2.4s ease;
    pointer-events: none;
  }
  .stars {
    position: absolute; inset: 0 0 auto 0;
    height: calc(var(--hdr) + max(220px, var(--sky-h)) * .8);
    background-image:
      radial-gradient(1px 1px at 12% 22%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 64%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 46% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 63% 42%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 58%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 6% 76%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 54% 80%, #fff 50%, transparent 51%);
    opacity: calc(.7 - var(--rise) * .7);
    transition: opacity 2.4s ease;
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 clamp(16px, 4vw, 40px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { flex: none; }
  .brand h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.25rem;
    line-height: 1.2;
  }
  .brand small {
    display: block;
    font-family: var(--body);
    font-weight: 300;
    font-size: .8rem;
    opacity: .7;
    direction: ltr;
    text-align: right;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: .875rem;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(21, 32, 58, .55);
    border: 1px solid rgba(239, 230, 210, .16);
    white-space: nowrap;
  }
  .status::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    opacity: .5;
  }
  .status[data-state="ready"]::before,
  .status[data-state="bot"]::before,
  .status[data-state="user"]::before { background: var(--sun); opacity: 1; }
  .status[data-state="error"] { color: var(--danger); }

  /* ---------- Horizon + sun ---------- */
  .horizon {
    position: relative;
    z-index: 1;
    overflow: hidden;            /* the ground hides the lower half of the sun */
    display: grid;
    place-items: end center;
  }
  .sun-wrap {
    --size: clamp(180px, 34vmin, 320px);
    position: relative;
    width: var(--size);
    height: var(--size);
    /* below the horizon at night, half-risen when connected */
    transform: translateY(calc(85% - var(--rise) * 35%));
    transition: transform 2.4s cubic-bezier(.2, .7, .1, 1);
  }
  .corona {
    position: absolute;
    inset: -40%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(246, 183, 60, .55) 0%, rgba(246, 183, 60, .18) 38%, transparent 66%);
    transform: scale(calc(.85 + var(--bot) * .55));
    opacity: calc(.35 + var(--rise) * .4 + var(--bot) * .4);
    transition: transform .12s linear, opacity .4s ease;
  }
  .sun {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, var(--sun-core) 0%, var(--sun) 55%, #e8902a 100%);
    box-shadow: 0 0 calc(30px + var(--bot) * 90px) rgba(246, 183, 60, .7);
    filter: saturate(calc(.5 + var(--rise) * .5));
    transition: box-shadow .12s linear, filter 2.4s ease;
  }
  .ripple {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: min(92vw, 900px);
    height: 2px;
    transform: translateX(-50%) scaleX(calc(.25 + var(--user) * .9));
    background: linear-gradient(90deg, transparent, var(--sky-light), #fff, var(--sky-light), transparent);
    opacity: calc(.25 + var(--user) * .75);
    box-shadow: 0 0 calc(6px + var(--user) * 24px) var(--sky-light);
    transition: transform .1s linear, opacity .1s linear;
  }

  /* ---------- Ground: solar panel field + transcript ---------- */
  .ground {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 0;
    background:
      repeating-linear-gradient(90deg, var(--panel-line) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(0deg, var(--panel-line) 0 1px, transparent 1px 40px),
      linear-gradient(to bottom, var(--panel), var(--night));
    border-top: 1px solid rgba(233, 180, 138, .45);
  }
  .transcript {
    min-height: 0;
    overflow-y: auto;
    padding: 20px clamp(16px, 4vw, 40px) 16px;
    scroll-behavior: smooth;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
  }
  .transcript-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty {
    margin: 12px auto 0;
    max-width: 46ch;
    text-align: center;
    opacity: .8;
  }
  .empty h2 {
    margin: 0 0 6px;
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.5rem;
    line-height: 1.3;
  }
  .empty p { margin: 0; font-size: .95rem; }

  .msg {
    max-width: 85%;
    padding: 10px 16px;
    border-radius: 18px;
    font-size: 1rem;
    unicode-bidi: plaintext;     /* Arabic and English both read correctly */
    text-align: start;
  }
  .msg.bot {
    align-self: flex-start;      /* right side in RTL */
    background: rgba(246, 183, 60, .14);
    border: 1px solid rgba(246, 183, 60, .35);
    border-start-start-radius: 4px;
  }
  .msg.user {
    align-self: flex-end;        /* left side in RTL */
    background: rgba(142, 197, 232, .12);
    border: 1px solid rgba(142, 197, 232, .3);
    border-start-end-radius: 4px;
  }
  .msg.interim { opacity: .6; }
  .msg .who {
    display: block;
    font-size: .75rem;
    opacity: .65;
    margin-bottom: 2px;
  }
  .notice {
    align-self: center;
    max-width: 52ch;
    text-align: center;
    font-size: .9rem;
    color: var(--danger);
    background: rgba(255, 155, 133, .1);
    border: 1px solid rgba(255, 155, 133, .35);
    border-radius: 12px;
    padding: 10px 14px;
  }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 16px clamp(16px, 4vw, 40px) max(20px, env(safe-area-inset-bottom));
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
  }
  button:focus-visible, a:focus-visible {
    outline: 3px solid var(--sky-light);
    outline-offset: 3px;
  }
  .call {
    min-width: 200px;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 1.05rem;
    color: #3a2300;
    background: linear-gradient(180deg, var(--sun-core), var(--sun));
    box-shadow: 0 6px 24px rgba(246, 183, 60, .35), inset 0 -2px 0 rgba(0, 0, 0, .12);
    transition: transform .15s ease, box-shadow .15s ease, background .3s ease, color .3s ease;
  }
  .call:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(246, 183, 60, .5); }
  .call:active { transform: translateY(1px); }
  .call[data-mode="end"] {
    color: var(--sand);
    background: rgba(21, 32, 58, .7);
    box-shadow: inset 0 0 0 1px rgba(239, 230, 210, .35);
  }
  .call:disabled { cursor: progress; opacity: .7; }
  .mic {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--sand);
    background: rgba(21, 32, 58, .7);
    box-shadow: inset 0 0 0 1px rgba(239, 230, 210, .35);
  }
  .mic[aria-pressed="true"] { color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
  .mic[hidden] { display: none; }
  .classic {
    position: absolute;
    inset-inline-start: clamp(16px, 4vw, 40px);
    bottom: max(24px, env(safe-area-inset-bottom));
    font-size: .8rem;
    color: var(--sand);
    opacity: .55;
  }
  .classic:hover { opacity: .9; }

  @media (max-width: 640px) {
    :root { --hdr: 68px; --sky-h: 34dvh; }
    .brand h1 { font-size: 1.05rem; }
    .classic { position: static; display: block; text-align: center; width: 100%; }
    .brand small { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sky, .stars, .sun-wrap, .sun, .corona, .ripple, .call { transition: none; }
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="sky" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>

  <header>
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="20" r="8" fill="#f6b73c"/>
        <g stroke="#f6b73c" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="4" x2="18" y2="8"/><line x1="6" y1="10" x2="9" y2="13"/>
          <line x1="30" y1="10" x2="27" y2="13"/><line x1="2" y1="22" x2="6" y2="22"/>
          <line x1="30" y1="22" x2="34" y2="22"/>
        </g>
        <rect x="0" y="28" width="36" height="8" fill="#15203a"/>
        <line x1="0" y1="28" x2="36" y2="28" stroke="#e9b48a" stroke-width="1.5"/>
      </svg>
      <div>
        <h1>الحياة للطاقة المتجددة</h1>
        <small>Al Hayat Renewable Energy</small>
      </div>
    </div>
    <span class="status" id="status" data-state="idle" role="status" aria-live="polite">غير متصل</span>
  </header>

  <div class="horizon" aria-hidden="true">
    <div class="sun-wrap">
      <div class="corona"></div>
      <div class="sun"></div>
    </div>
    <div class="ripple"></div>
  </div>

  <main class="ground">
    <section class="transcript" id="transcript" aria-label="المحادثة" aria-live="polite">
      <div class="transcript-inner" id="log">
        <div class="empty" id="empty">
          <h2>احكي مع مساعد الحياة</h2>
          <p>اسأل عن أسعار الأنظمة الشمسية، الفروع، التقسيط أو الكفالة. اضغط "ابدأ المكالمة" واسمح للمتصفح يستخدم المايكروفون.</p>
        </div>
      </div>
    </section>

    <div class="controls">
      <button class="mic" id="micBtn" type="button" aria-pressed="false" aria-label="كتم المايكروفون" title="كتم المايكروفون" hidden>
        <svg id="micIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/>
          <line id="micSlash" x1="4" y1="4" x2="20" y2="20" style="display:none"/>
        </svg>
      </button>
      <button class="call" id="callBtn" type="button" data-mode="start">ابدأ المكالمة</button>
      <a class="classic" href="/classic/">الواجهة الأصلية (Pipecat Playground)</a>
    </div>
  </main>
</div>

<audio id="botAudio" autoplay playsinline></audio>

<script type="module">
  // Official Pipecat browser SDK.
  import { PipecatClient } from "https://esm.sh/@pipecat-ai/client-js@1.15.0";

  // Where is this page running?
  //  - on your computer (localhost): WebRTC, via demo_bot.py
  //  - online (Render, Railway, ...): WebSocket at /ws, via app.py
  const IS_LOCAL = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
  const ACCESS_CODE = new URLSearchParams(location.search).get("code") || "";

  async function makeTransport() {
    if (IS_LOCAL) {
      const { SmallWebRTCTransport } = await import(
        "https://esm.sh/@pipecat-ai/small-webrtc-transport@1.11.1?deps=@pipecat-ai/client-js@1.15.0");
      return new SmallWebRTCTransport();
    }
    const { WebSocketTransport } = await import(
      "https://esm.sh/@pipecat-ai/websocket-transport@1.8.1?deps=@pipecat-ai/client-js@1.15.0");
    return new WebSocketTransport();
  }

  function connectParams() {
    if (IS_LOCAL) return { webrtcRequestParams: { endpoint: "/api/offer" } };
    const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`
      + (ACCESS_CODE ? `?code=${encodeURIComponent(ACCESS_CODE)}` : "");
    return { wsUrl };
  }

  // Ask the server whether the call can start, to give a clear message if not.
  async function preflight() {
    if (IS_LOCAL) return null;
    try {
      const r = await fetch("/health", { cache: "no-store" });
      const h = await r.json();
      if (!h.openai_key_set) return "المفتاح OPENAI_API_KEY مش محطوط بإعدادات السيرفر (Environment).";
      if (h.access_code_required && !ACCESS_CODE) return "هاد الرابط محمي بكلمة سر. افتح الرابط مع ?code=كلمة_السر بآخره.";
    } catch { /* server may be waking up; let the call try anyway */ }
    return null;
  }

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const statusEl = $("status"), callBtn = $("callBtn"), micBtn = $("micBtn");
  const log = $("log"), transcript = $("transcript"), botAudio = $("botAudio");

  let client = null;
  let micMuted = false;

  // The original Playground only exists on your computer.
  if (!IS_LOCAL) document.querySelector(".classic")?.remove();

  // ---------- UI helpers ----------
  const STATUS = {
    idle: "غير متصل",
    connecting: "جاري الاتصال…",
    ready: "جاهز، احكي",
    user: "بسمعك…",
    bot: "المساعد بيحكي",
    error: "في مشكلة",
  };
  function setStatus(state) {
    statusEl.dataset.state = state;
    statusEl.textContent = STATUS[state];
  }
  function setRise(on) { root.style.setProperty("--rise", on ? 1 : 0); }

  function clearEmpty() { $("empty")?.remove(); }
  function scrollDown() { transcript.scrollTop = transcript.scrollHeight; }

  function addNotice(text) {
    clearEmpty();
    const el = document.createElement("div");
    el.className = "notice";
    el.textContent = text;
    log.appendChild(el);
    scrollDown();
  }

  function newBubble(who) {
    clearEmpty();
    const el = document.createElement("div");
    el.className = `msg ${who}`;
    const label = document.createElement("span");
    label.className = "who";
    label.textContent = who === "bot" ? "مساعد الحياة" : "انت";
    const text = document.createElement("span");
    text.className = "text";
    el.append(label, text);
    log.appendChild(el);
    scrollDown();
    return el;
  }

  // ---------- Transcript state ----------
  let userBubble = null;      // current interim/final user bubble
  let botBubble = null;       // current bot turn bubble
  let botHasSentence = false; // prefer sentence-level text over word-level

  function onUserTranscript(data) {
    if (!data?.text) return;
    if (!userBubble) userBubble = newBubble("user");
    userBubble.classList.toggle("interim", !data.final);
    userBubble.querySelector(".text").textContent = data.text;
    if (data.final) userBubble = null;
    scrollDown();
  }

  function onBotOutput(data) {
    if (!data?.text) return;
    const type = data.output_type || data.aggregated_by || data.text_type || "sentence";
    if (!["sentence", "word", "token"].includes(type)) return; // skip sounds/pauses
    if (!botBubble) { botBubble = newBubble("bot"); botHasSentence = false; }
    const t = botBubble.querySelector(".text");
    if (type === "sentence") {
      if (!botHasSentence) t.textContent = "";   // replace any word-by-word text
      botHasSentence = true;
      t.textContent += (t.textContent ? " " : "") + data.text.trim();
    } else if (!botHasSentence) {
      t.textContent += (type === "word" && t.textContent ? " " : "") + data.text;
    }
    scrollDown();
  }

  // ---------- Voice levels -> sun & horizon ----------
  const level = { bot: 0, user: 0 };
  const target = { bot: 0, user: 0 };
  function tick() {
    for (const k of ["bot", "user"]) {
      level[k] += (target[k] - level[k]) * 0.25;
      target[k] *= 0.9; // decay between level events
      root.style.setProperty(`--${k}`, level[k].toFixed(3));
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  const boost = (v) => Math.min(1, Math.sqrt(Math.max(0, v)) * 1.6);

  // ---------- Bot audio playback + level meter ----------
  let audioCtx = null, analyser = null, meterSrc = null, meterBuf = null;
  function ensureAudioContext() {
    // Created on the "Start call" click so the browser allows sound.
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    audioCtx?.resume?.().catch(() => {});
  }
  function playBotTrack(track) {
    const stream = new MediaStream([track]);
    botAudio.srcObject = stream;
    botAudio.muted = false;
    botAudio.play().catch(() => {
      addNotice("المتصفح منع الصوت. اضغط أي مكان بالصفحة عشان يشتغل الصوت.");
      document.addEventListener("click", () => botAudio.play().catch(() => {}), { once: true });
    });
    // Measure the bot's loudness to drive the sun (audio itself plays via <audio>).
    try {
      if (!audioCtx) return;
      meterSrc?.disconnect();
      meterSrc = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      meterBuf = new Uint8Array(analyser.fftSize);
      meterSrc.connect(analyser);
    } catch (e) { console.warn("Level meter unavailable", e); }
  }
  function readBotLevel() {
    if (analyser && meterBuf) {
      analyser.getByteTimeDomainData(meterBuf);
      let sum = 0;
      for (const v of meterBuf) { const d = (v - 128) / 128; sum += d * d; }
      target.bot = Math.max(target.bot, boost(Math.sqrt(sum / meterBuf.length) * 2));
    }
    requestAnimationFrame(readBotLevel);
  }
  requestAnimationFrame(readBotLevel);

  // ---------- Call control ----------
  async function startCall() {
    callBtn.disabled = true;
    setStatus("connecting");
    setRise(true);
    ensureAudioContext();
    botAudio.play().catch(() => {}); // unlock audio playback during the click

    const problem = await preflight();
    if (problem) {
      addNotice(problem);
      resetUI(true);
      callBtn.disabled = false;
      return;
    }

    let transport;
    try {
      transport = await makeTransport();
    } catch (err) {
      console.error(err);
      addNotice("ما قدرنا نحمّل أدوات الاتصال. تأكد من الإنترنت وجرّب مرة ثانية.");
      resetUI(true);
      callBtn.disabled = false;
      return;
    }

    client = new PipecatClient({
      transport,
      enableMic: true,
      enableCam: false,
      callbacks: {
        onBotReady: () => setStatus("ready"),
        onDisconnected: () => resetUI(),
        onTrackStarted: (track, participant) => {
          // SmallWebRTC reports the bot's track without a participant,
          // so anything that is not explicitly local is the bot.
          if (track.kind === "audio" && !participant?.local) playBotTrack(track);
        },
        onLocalAudioLevel: (v) => { if (!micMuted) target.user = Math.max(target.user, boost(v)); },
        onRemoteAudioLevel: (v) => { target.bot = Math.max(target.bot, boost(v)); },
        onUserStartedSpeaking: () => setStatus("user"),
        onUserStoppedSpeaking: () => setStatus("ready"),
        onBotStartedSpeaking: () => { setStatus("bot"); botBubble = null; },
        onBotStoppedSpeaking: () => setStatus("ready"),
        onUserTranscript,
        onBotOutput,
        onDeviceError: () => {
          addNotice("المتصفح مانع المايكروفون. اضغط على القفل جنب عنوان الصفحة، خلي Microphone على Allow، وبعدين اعمل Refresh وجرّب مرة ثانية.");
        },
        onError: (msg) => {
          console.error("Pipecat error", msg);
          addNotice(IS_LOCAL
            ? "صار خطأ بالمحادثة. شوف نافذة PowerShell لتعرف السبب."
            : "صار خطأ بالمحادثة. شوف الـ Logs بلوحة الاستضافة لتعرف السبب.");
        },
      },
    });

    try {
      await client.connect(connectParams());
      callBtn.dataset.mode = "end";
      callBtn.textContent = "إنهاء المكالمة";
      micBtn.hidden = false;
      setStatus("ready");
    } catch (err) {
      console.error(err);
      const blocked = /permission|notallowed|denied/i.test(String(err?.name || err?.message || err));
      addNotice(blocked
        ? "المتصفح مانع المايكروفون. اضغط على القفل جنب عنوان الصفحة، خلي Microphone على Allow، وبعدين جرّب مرة ثانية."
        : IS_LOCAL
          ? "ما قدرنا نوصل للمساعد. تأكد إنه نافذة PowerShell لسا شغالة والبوت مكتوب فيها إنه جاهز، وبعدين جرّب مرة ثانية."
          : "ما قدرنا نوصل للمساعد. إذا السيرفر كان نايم، استنى دقيقة وجرّب مرة ثانية.");
      try { await client?.disconnect(); } catch {}
      resetUI(true);
    } finally {
      callBtn.disabled = false;
    }
  }

  async function endCall() {
    callBtn.disabled = true;
    try { await client?.disconnect(); } catch {}
    resetUI();
    callBtn.disabled = false;
  }

  function resetUI(isError = false) {
    client = null;
    micMuted = false;
    userBubble = botBubble = null;
    botAudio.srcObject = null;
    try { meterSrc?.disconnect(); } catch {}
    meterSrc = analyser = meterBuf = null;
    target.bot = target.user = 0;
    callBtn.dataset.mode = "start";
    callBtn.textContent = "ابدأ المكالمة";
    micBtn.hidden = true;
    updateMicButton();
    setRise(false);
    setStatus(isError ? "error" : "idle");
  }

  function updateMicButton() {
    micBtn.setAttribute("aria-pressed", String(micMuted));
    const label = micMuted ? "شغّل المايكروفون" : "كتم المايكروفون";
    micBtn.setAttribute("aria-label", label);
    micBtn.title = label;
    $("micSlash").style.display = micMuted ? "" : "none";
  }

  callBtn.addEventListener("click", () => (callBtn.dataset.mode === "end" ? endCall() : startCall()));
  micBtn.addEventListener("click", () => {
    if (!client) return;
    micMuted = !micMuted;
    client.enableMic(!micMuted);
    updateMicButton();
  });
</script>
</body>
</html>
